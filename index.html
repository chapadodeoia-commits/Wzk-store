<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WZK Store</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #0b1a3a, #020617);
    color: white;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 15px;
    padding: 10px;
    border-radius: 20px;
    background: linear-gradient(145deg, #0a1a3f, #020817);
    border: 1px solid #1a2a6b;
}

.menu-btn, .icon-btn {
    background: #0f1c45;
    padding: 12px;
    border-radius: 50%;
    border: 1px solid #1a2a6b;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #00aaff;
}

/* BANNER */
.banner {
    margin: 15px;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(90deg, #001d4d, #003a8c);
    padding: 25px;
}

.banner h1 {
    margin: 0;
    font-size: 26px;
}

.banner span {
    font-size: 13px;
    opacity: 0.7;
}

/* CATEGORIA BOX */
.category-box {
    margin: 15px;
    padding: 20px;
    border-radius: 20px;
    background: linear-gradient(145deg, #0a1a3f, #020817);
    border: 1px solid #1a2a6b;
}

.category-select {
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    background: #0f1c45;
    border: 1px solid #1a2a6b;
}

/* FILTROS */
.filters {
    display: flex;
    gap: 10px;
    margin: 15px;
    flex-wrap: wrap;
}

.filter-btn {
    background: #0f1c45;
    padding: 10px 15px;
    border-radius: 10px;
    border: 1px solid #1a2a6b;
}

/* PRODUTOS */
.products {
    padding: 15px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.card {
    background: linear-gradient(145deg, #0d1f4f, #020817);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #1a2a6b;
}

.card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
}

.card-content {
    padding: 10px;
}

.card-title {
    font-weight: bold;
}

.card-price {
    color: #00ffcc;
}

.buy-btn {
    display: block;
    margin-top: 10px;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    background: #007bff;
    color: white;
    text-decoration: none;
}

/* WHATSAPP */
.whatsapp {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    padding: 15px;
    border-radius: 50%;
    text-decoration: none;
    color: white;
    font-size: 22px;
}
</style>
</head>

<body>

<div class="header">
    <div class="menu-btn">☰</div>
    <div class="logo">WZK</div>
    <div style="display:flex; gap:10px;">
        <div class="icon-btn">👤</div>
        <div class="icon-btn">🛒</div>
    </div>
</div>

<div class="banner">
    <h1>ASSINATURAS</h1>
    <span>VEJA NOSSO CATÁLOGO DE PRODUTOS</span>
</div>

<div class="category-box">
    <strong>Navegar por categoria</strong>
    <div>Selecionada: 🎬 Assinaturas</div>

    <div class="category-select">🎬 Assinaturas ▼</div>
</div>

<div class="filters">
    <div class="filter-btn">Preço: Menor</div>
    <div class="filter-btn">Preço: Maior</div>
    <div class="filter-btn">A-Z</div>
    <div class="filter-btn">Z-A</div>
</div>

<div class="products">

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/f1/Prime_Video.png">
        <div class="card-content">
            <div class="card-title">Prime Video</div>
            <div class="card-price">R$ 10,00</div>
            <a class="buy-btn" href="https://wa.me/5519999650414?text=Quero%20Prime%20Video">Comprar</a>
        </div>
    </div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Crunchyroll_Logo.png">
        <div class="card-content">
            <div class="card-title">Crunchyroll</div>
            <div class="card-price">R$ 12,00</div>
            <a class="buy-btn" href="https://wa.me/5519999650414?text=Quero%20Crunchyroll">Comprar</a>
        </div>
    </div>

</div>

<a class="whatsapp" href="https://wa.me/5519999650414?text=Quero%20comprar%20na%20WZK">
💬
</a>

</body>
</html>
