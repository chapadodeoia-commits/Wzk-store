<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WZK Store</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#020617;
  color:white;
}

/* BOTÃO SUPORTE */
.support-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  box-shadow:0 0 20px #2563eb;
}

/* CHAT */
.chat{
  position:fixed;
  bottom:-100%;
  right:0;
  width:100%;
  height:80%;
  background:#020617;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
  transition:0.3s;
}

.chat.active{
  bottom:0;
}

/* HEADER CHAT */
.chat-header{
  background:#0f172a;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.chat-body{
  height:60%;
  overflow-y:auto;
  padding:10px;
}

/* MENSAGEM */
.msg{
  padding:10px;
  margin:5px;
  border-radius:10px;
  max-width:70%;
}

.cliente{
  background:#2563eb;
  margin-left:auto;
}

.admin{
  background:#1e293b;
}

/* INPUT */
.chat-input{
  display:flex;
  padding:10px;
}

.chat-input input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
}

.chat-input button{
  margin-left:10px;
  background:#2563eb;
  border:none;
  color:white;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h2 style="padding:20px;">WZK Store</h2>

<!-- BOTÃO SUPORTE -->
<div class="support-btn" onclick="abrirChat()">
🎤
</div>

<!-- CHAT -->
<div id="chat" class="chat">
  
  <div class="chat-header">
    <strong>Suporte</strong>
    <span onclick="fecharChat()">✖</span>
  </div>

  <div id="mensagens" class="chat-body"></div>

  <div class="chat-input">
    <input id="msgInput" placeholder="Digite sua mensagem...">
    <button onclick="enviar()">Enviar</button>
  </div>

</div>

<script>
const supabase = supabase.createClient(
  "https://pxurrdnkawuibzebmycl.supabase.co/rest/v1/",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4dXJyZG5rYXd1aWJ6ZWJteWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwODQ1NjIsImV4cCI6MjEwNjY2MDU2Mn0.DCpH86xZaokfeeVhRlfKu2lt5SBGM15KZYK_HREkN9c"
);

let conversaId = null;

/* ABRIR CHAT */
async function abrirChat(){
  document.getElementById("chat").classList.add("active");

  if(!conversaId){
    const { data } = await supabase
      .from("conversas")
      .insert([{ user_id: "user123" }])
      .select()
      .single();

    conversaId = data.id;

    ouvirMensagens();
  }
}

/* FECHAR */
function fecharChat(){
  document.getElementById("chat").classList.remove("active");
}

/* ENVIAR */
async function enviar(){
  const texto = document.getElementById("msgInput").value;

  if(!texto) return;

  await supabase.from("mensagens").insert([
    {
      conversa_id: conversaId,
      autor: "cliente",
      mensagem: texto
    }
  ]);

  document.getElementById("msgInput").value = "";
}

/* RECEBER EM TEMPO REAL */
function ouvirMensagens(){
  supabase
    .channel("chat")
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"mensagens",
        filter:`conversa_id=eq.${conversaId}`
      },
      (payload)=>{
        adicionarMsg(payload.new);
      }
    )
    .subscribe();
}

/* MOSTRAR */
function adicionarMsg(msg){
  const div = document.createElement("div");

  div.classList.add("msg");
  div.classList.add(msg.autor === "cliente" ? "cliente" : "admin");

  div.innerText = msg.mensagem;

  document.getElementById("mensagens").appendChild(div);
}
</script>

</body>
</html>
